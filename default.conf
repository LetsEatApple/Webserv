# Example of a simple server
error_page 404 /404.html;
client_max_body_size 20M;

server {
    listen 127.0.0.1:8080;
    client_max_body_size 10M; # Override default value
	server_name example.com www.example.com;
    error_page 404 /404.html;

    location / {
      return 301 /user;
        limit_except POST;
        autoindex off;
    }
    
    location /upload {
        limit_except POST;
        autoindex off;
    }
  } 
server {
    listen localhost:8000;
    client_max_body_size 10M; # Override default value
	server_name example.com www.example.com;
    error_page 404 /404.html;

    location / {
      return 301 /user;
        limit_except POST;
        autoindex off;
    }
    
    location /upload {
        limit_except POST;
        autoindex off;
    }
}
