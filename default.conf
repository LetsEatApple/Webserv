# Example of a simple server
error_page 404 /404.html;
client_max_body_size 20M;
autoindex on;
index index2.html;
server {
    listen 127.0.0.1:8080;
    client_max_body_size 1M; # Override default value
	server_name example.com www.example.com;
    error_page 404 /404.html;
    autoindex on;

    location / {
    client_max_body_size 10; # Override default value
        alias /tmp/;
        autoindex off;
    }
    location /upload {
    client_max_body_size 10k; # Override default value
        limit_except POST;
        index index.html;
        alias /tmp/uploads;
    }
}

