# Example of a simple server
error_page 404 /404.html;
client_max_body_size 20M;

server {
    listen ::1:80;
    client_max_body_size 10M; # Override default value
	server_name example.com www.example.com;
    error_page 404 /404.html;

    location /upload {
        limit_exept POST;
        alias /tmp/uploads;
        autoindex off;
    }
}

