server {
    listen 127.0.0.1:8000;

    location / {
      limit_except GET;
      alias /home/user/42/Webserv/websites/cgi;
      cgi .py /usr/bin/python3;
    }
    
    location /perl {
      limit_except GET;
      alias /home/user/42/Webserv/websites/cgi/cgi-bin;
      cgi .cgi /usr/bin/perl;
    }
    
    location /slow {
      limit_except GET;
      alias /home/user/42/Webserv/websites/slow;
      cgi .php /usr/bin/php-cgi8.4;
    }
}

server {
    listen 127.0.0.1:8001;

    location / {
      alias /home/user/42/Webserv/websites/empty;
    }
}
